name: Build Android APK from ZIP
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          unzip -o *.zip -d temp_extracted
          SETTINGS_PATH=$(find temp_extracted -name "settings.gradle.kts" | head -n 1)
          PROJ_DIR=$(dirname "$SETTINGS_PATH")
          echo "Project source directory found at: $PROJ_DIR"
          cp -r "$PROJ_DIR"/. .
          rm -rf temp_extracted
          ls -la

      - name: Generate Dummy google-services.json
        run: |
          mkdir -p app
          echo '{
            "project_info": {
              "project_number": "123456789",
              "project_id": "dummy-project"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:123456789",
                  "android_client_info": {
                    "package_name": "com.app.calculator"
                  }
                },
                "api_key": [
                  {
                    "current_key": "dummy_key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }' > app/google-services.json

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Missing Gradle Wrapper and Keystore
        run: |
          gradle wrapper
          chmod +x gradlew
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/app-debug.apk"
