name: Build Android APK from ZIP
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          unzip -o *.zip -d temp_extracted
          SETTINGS_PATH=$(find temp_extracted -name "settings.gradle.kts" | head -n 1)
          PROJ_DIR=$(dirname "$SETTINGS_PATH")
          echo "Project source directory found at: $PROJ_DIR"
          cp -r "$PROJ_DIR"/. .
          rm -rf temp_extracted
          ls -la

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/app-debug.apk"
